<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Order Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
  <div class="max-w-md mx-auto min-h-screen flex flex-col">
    
    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-4 shadow-lg sticky top-0 z-10">
      <h1 class="text-xl font-bold text-center">📦 My Order List</h1>
      <p class="text-center text-blue-100 text-sm mt-1" id="itemCount">0 items</p>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-4 pb-32">
      
      <!-- Add Product Form -->
      <div class="bg-white rounded-2xl shadow-md p-4 mb-4">
        <h2 class="text-sm font-semibold text-gray-700 mb-3">Add New Item</h2>
        <div class="space-y-3">
          <input id="productName" type="text" placeholder="Product name" autocomplete="off"
                 class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-base focus:outline-none focus:border-blue-500" />
          <input id="productQty" type="number" placeholder="Quantity" inputmode="numeric" pattern="[0-9]*"
                 class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-base focus:outline-none focus:border-blue-500" />
          <button onclick="addProduct()"
                  class="w-full bg-gradient-to-r from-green-500 to-green-600 text-white font-semibold px-4 py-3 rounded-xl shadow-md active:scale-95 transition-transform">
            ➕ Add Item
          </button>
        </div>
      </div>

      <!-- Product List -->
      <div id="productList" class="space-y-2"></div>
    </div>

    <!-- Bottom Action Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-gray-200 shadow-2xl p-4 max-w-md mx-auto">
      <div class="space-y-2">
        <input id="phoneNumber" type="tel" placeholder="Phone (e.g., 919876543210)" inputmode="tel"
               class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-base focus:outline-none focus:border-blue-500" />
        <div class="flex gap-2">
          <button onclick="sendSelectedToWhatsApp()"
                  class="flex-1 bg-gradient-to-r from-blue-500 to-blue-600 text-white font-semibold py-3 rounded-xl shadow-md active:scale-95 transition-transform">
            📱 Send to WhatsApp
          </button>
          <button onclick="clearAll()"
                  class="bg-red-500 text-white font-semibold px-4 py-3 rounded-xl shadow-md active:scale-95 transition-transform">
            🗑️
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    let products = [];

    function saveProducts() {
      // Using in-memory storage only
    }

    function updateCount() {
      const count = products.length;
      document.getElementById('itemCount').textContent = `${count} item${count !== 1 ? 's' : ''}`;
    }

    function renderProducts() {
      const list = document.getElementById('productList');
      list.innerHTML = '';

      if (products.length === 0) {
        list.innerHTML = `
          <div class="bg-white rounded-2xl shadow-md p-8 text-center">
            <div class="text-6xl mb-3">📋</div>
            <p class="text-gray-400 text-sm">No items yet. Add your first product!</p>
          </div>
        `;
        updateCount();
        return;
      }

      products.forEach((product, index) => {
        const item = document.createElement('div');
        item.className = 'bg-white rounded-2xl shadow-md p-4 active:scale-98 transition-transform';

        item.innerHTML = `
          <div class="flex items-center gap-3">
            <input type="checkbox" ${product.selected ? 'checked' : ''} onchange="toggleSelect(${index})" 
                   class="w-6 h-6 rounded border-2 border-gray-300 text-blue-600 focus:ring-2 focus:ring-blue-500" />
            <div class="flex-1 min-w-0">
              <div class="${product.completed ? 'line-through text-gray-400' : 'text-gray-800 font-medium'}">
                ${product.name}
              </div>
              <div class="text-sm ${product.completed ? 'text-gray-300' : 'text-gray-500'}">
                Qty: ${product.qty}
              </div>
            </div>
            <div class="flex gap-2">
              <button onclick="toggleComplete(${index})" 
                      class="text-2xl active:scale-90 transition-transform">
                ${product.completed ? '↩️' : '✅'}
              </button>
              <button onclick="deleteProduct(${index})" 
                      class="text-2xl active:scale-90 transition-transform">
                🗑️
              </button>
            </div>
          </div>
        `;

        list.appendChild(item);
      });

      updateCount();
    }

    function addProduct() {
      const name = document.getElementById('productName').value.trim();
      const qty = document.getElementById('productQty').value.trim();
      
      if (!name || !qty) {
        showToast('⚠️ Please enter both product name and quantity');
        return;
      }

      products.unshift({ name, qty, completed: false, selected: false });
      saveProducts();
      renderProducts();

      document.getElementById('productName').value = '';
      document.getElementById('productQty').value = '';
      
      showToast('✅ Item added successfully');
    }

    function deleteProduct(index) {
      if (confirm('Delete this item?')) {
        products.splice(index, 1);
        saveProducts();
        renderProducts();
        showToast('🗑️ Item deleted');
      }
    }

    function toggleComplete(index) {
      products[index].completed = !products[index].completed;
      saveProducts();
      renderProducts();
    }

    function toggleSelect(index) {
      products[index].selected = !products[index].selected;
      saveProducts();
    }

    function sendSelectedToWhatsApp() {
      const phone = document.getElementById('phoneNumber').value.trim();
      if (!phone) {
        showToast('⚠️ Please enter a phone number');
        return;
      }

      const selected = products.filter(p => p.selected);
      if (selected.length === 0) {
        showToast('⚠️ Please select at least one item');
        return;
      }

      let message = '🧾 *Order List*\n\n';
      selected.forEach((p, i) => {
        message += `${i + 1}. ${p.name} - Qty: ${p.qty}\n`;
      });

      const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');
      
      showToast('📱 Opening WhatsApp...');
    }

    function clearAll() {
      if (confirm('Clear all items?')) {
        products = [];
        saveProducts();
        renderProducts();
        showToast('🧹 All items cleared');
      }
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.textContent = message;
      toast.className = 'fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg z-50 text-sm font-medium';
      document.body.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, 2000);
    }

    // Initial render
    renderProducts();
  </script>
</body>
</html>
